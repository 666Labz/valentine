<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Valentine Book</title>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:linear-gradient(135deg,#ff9ecf,#ff6fa5,#ff4d88);
  font-family:'Poppins',sans-serif;
  color:white;
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
}

h1{
  font-family:'Great Vibes',cursive;
  font-size:36px;
  margin-top:20px;
  margin-bottom:15px;
  text-align:center;
  text-shadow:0 0 12px rgba(255,255,255,0.9);
  z-index:5;
}

#book-wrapper{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  width:100%;
}

#book{
  width:92vw;
  max-width:420px;
  height:580px;
}

.page{
  background:white;
  border-radius:14px;
  overflow:hidden;
}

.page img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* MUSIC BUTTON FIXED */
.music-box{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;
}

/* HEART STYLE */
.heart{
  position:absolute;
  pointer-events:none;
  animation:fall linear forwards;
  color:white;
}

@keyframes fall{
  from{ transform:translateY(-10vh); }
  to{ transform:translateY(110vh); }
}
</style>
</head>

<body>

<h1>💖 Happy Valentine Sayang 💖</h1>

<div id="book-wrapper">
  <div id="book">

    <div class="page">
      <img src="cover.jpg">
    </div>

    <div class="page">
      <img src="spread1.jpg">
    </div>

    <div class="page">
      <img src="spread2.jpg">
    </div>

    <div class="page">
      <img src="backcover.jpg">
    </div>

  </div>
</div>

<div class="music-box">
  <audio id="music" controls>
    <source src="lagu.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
/* PAGE FLIP FIX */
const pageFlip = new St.PageFlip(
  document.getElementById("book"),
  {
    width:420,
    height:580,
    size:"stretch",
    minWidth:300,
    maxWidth:420,
    minHeight:500,
    maxHeight:580,
    showCover:true,
    mobileScrollSupport:false,
    flippingTime:800,
    useMouseEvents:true
  }
);

pageFlip.loadFromHTML(document.querySelectorAll("#book .page"));

/* HEART SYSTEM */
let gyroX = 0;

function createHeart(){
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💗";

  const size = Math.random()*25 + 18;
  heart.style.fontSize = size + "px";
  heart.style.left = Math.random()*100 + "vw";
  heart.style.animationDuration = (Math.random()*2 + 2.5) + "s"; // lebih cepet

  document.body.appendChild(heart);

  let posX = 0;
  let randomShake = Math.random()*8 - 4;

  function move(){
    posX += (gyroX * 0.5) + randomShake;
    heart.style.transform = `translate(${posX}px,0)`;
    requestAnimationFrame(move);
  }
  move();

  setTimeout(()=>{
    heart.remove();
  },4000);
}

setInterval(createHeart,250);

/* GYRO SUPPORT */
if(window.DeviceOrientationEvent){
  window.addEventListener("deviceorientation", function(event){
    gyroX = event.gamma || 0;
  });
}
</script>

</body>
</html>
