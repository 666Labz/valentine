<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Valentine Book</title>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  overflow:hidden;
  background:linear-gradient(135deg,#ff9ecf,#ff6fa5,#ff4d88);
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-family:'Poppins',sans-serif;
  color:white;
}

/* TITLE */
h1{
  font-family:'Great Vibes',cursive;
  font-size:44px;
  margin-bottom:15px;
  text-shadow:0 0 15px rgba(255,255,255,0.8);
  z-index:5;
}

/* BOOK */
#book{
  width:520px;
  height:400px;
  margin-bottom:20px;
  z-index:5;
}

.page{
  background:white;
  overflow:hidden;
  border-radius:8px;
}

.half{
  width:200%;
  height:100%;
}

.left{ transform:translateX(0%); }
.right{ transform:translateX(-50%); }

audio{
  z-index:5;
}

/* HEART */
.heart{
  position:absolute;
  pointer-events:none;
  z-index:1;
}
</style>
</head>

<body>

<h1>💖 Happy Valentine Sayang 💖</h1>

<div id="book">

  <!-- FRONT COVER -->
  <div class="page">
    <img src="cover.jpg" style="width:100%;height:100%;object-fit:cover;">
  </div>

  <!-- SPREAD 1 -->
  <div class="page">
    <img src="spread1.jpg" class="half left">
  </div>
  <div class="page">
    <img src="spread1.jpg" class="half right">
  </div>

  <!-- SPREAD 2 -->
  <div class="page">
    <img src="spread2.jpg" class="half left">
  </div>
  <div class="page">
    <img src="spread2.jpg" class="half right">
  </div>

  <!-- BACK COVER -->
  <div class="page">
    <img src="backcover.jpg" style="width:100%;height:100%;object-fit:cover;">
  </div>

</div>

<audio controls autoplay loop>
  <source src="lagu.mp3" type="audio/mpeg">
</audio>

<script>
/* BOOK INIT */
const pageFlip = new St.PageFlip(
  document.getElementById("book"),
  {
    width:260,
    height:400,
    size:"fixed",
    showCover:true,
    useMouseEvents:true,
    mobileScrollSupport:true,
    flippingTime:900,
    maxShadowOpacity:0.6
  }
);

pageFlip.loadFromHTML(document.querySelectorAll("#book .page"));

/* HEART SYSTEM */
let gyroX = 0;

function createHeart(){
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💗";

  const size = Math.random()*15 + 15;
  heart.style.fontSize = size + "px";
  heart.style.left = Math.random()*100 + "vw";
  heart.style.top = "-50px";

  document.body.appendChild(heart);

  let posX = 0;
  let posY = -50;

  function animate(){
    posY += 1;               // ke bawah
    posX += gyroX * 0.05;    // goyang

    heart.style.transform = `translate(${posX}px, ${posY}px)`;

    if(posY < window.innerHeight + 50){
      requestAnimationFrame(animate);
    } else {
      heart.remove();
    }
  }

  animate();
}

setInterval(createHeart, 500);

/* GYRO */
if (window.DeviceOrientationEvent) {
  window.addEventListener("deviceorientation", function(event){
    gyroX = event.gamma || 0;
  });
}
</script>

</body>
</html>
