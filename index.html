<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Valentine Book</title>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  background:linear-gradient(135deg,#ff9ecf,#ff6fa5,#ff4d88);
  font-family:sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;
}

/* TITLE */
h1{
  color:white;
  margin:15px 0;
  text-align:center;
  z-index:5;
}

/* BOOK AREA */
#book-wrapper{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  width:100%;
  z-index:5;
}

#book{
  width:360px;
  height:560px;
}

.page{
  background:black;
  overflow:hidden;
  border-radius:12px;
}

/* SPREAD */
.spread{
  width:200%;
  height:100%;
  object-fit:cover;
}

.left{ transform:translateX(0%); }
.right{ transform:translateX(-50%); }

/* MUSIC */
.music-box{
  margin:15px 0 20px 0;
  z-index:5;
}

/* HEART */
.heart{
  position:absolute;
  pointer-events:none;
  animation:fall linear forwards;
  color:white;
  z-index:1;
}

@keyframes fall{
  from{ transform:translateY(-10vh); }
  to{ transform:translateY(110vh); }
}

/* GYRO BTN */
#gyroBtn{
  position:fixed;
  top:10px;
  right:10px;
  z-index:9999;
  padding:6px 10px;
  border:none;
  border-radius:8px;
  background:white;
  font-size:12px;
}
</style>
</head>

<body>

<h1> Happy Valentine Sayangggg </h1>
<button id="gyroBtn">Enable Gyro</button>

<div id="book-wrapper">
  <div id="book">

    <div class="page">
      <img src="cover.jpg" style="width:100%;height:100%;object-fit:cover;">
    </div>

    <div class="page">
      <img src="spread1.jpg" class="spread left">
    </div>
    <div class="page">
      <img src="spread1.jpg" class="spread right">
    </div>

    <div class="page">
      <img src="spread2.jpg" class="spread left">
    </div>
    <div class="page">
      <img src="spread2.jpg" class="spread right">
    </div>

    <div class="page">
      <img src="backcover.jpg" style="width:100%;height:100%;object-fit:cover;">
    </div>

  </div>
</div>

<div class="music-box">
  <audio controls>
    <source src="lagu.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
/* PAGEFLIP */
const pageFlip = new St.PageFlip(
  document.getElementById("book"),
  {
    width:360,
    height:560,
    size:"fixed",
    showCover:true,
    mobileScrollSupport:false,
    useMouseEvents:true
  }
);

pageFlip.loadFromHTML(document.querySelectorAll("#book .page"));

/* HEART + GYRO */
let gyroX = 0;

function createHeart(){
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💗";

  heart.style.fontSize = (Math.random()*20+18)+"px";
  heart.style.left = Math.random()*100+"vw";
  heart.style.animationDuration = (Math.random()*1.5+2)+"s";

  document.body.appendChild(heart);

  let posX = 0;
  let randomShake = Math.random()*6 - 3;

  function move(){
    posX += (gyroX * 0.5) + randomShake;
    heart.style.transform = `translate(${posX}px,0)`;
    requestAnimationFrame(move);
  }
  move();

  setTimeout(()=>heart.remove(),3500);
}

setInterval(createHeart,250);

/* GYRO ENABLE */
function enableGyro(){
  if(typeof DeviceOrientationEvent !== "undefined" &&
     typeof DeviceOrientationEvent.requestPermission === "function"){

    DeviceOrientationEvent.requestPermission()
      .then(response=>{
        if(response=="granted"){
          window.addEventListener("deviceorientation", handleOrientation);
          document.getElementById("gyroBtn").style.display="none";
        }
      });

  } else {
    window.addEventListener("deviceorientation", handleOrientation);
    document.getElementById("gyroBtn").style.display="none";
  }
}

function handleOrientation(event){
  gyroX = event.gamma || 0;
}

document.getElementById("gyroBtn").addEventListener("click", enableGyro);
</script>

</body>
</html>
